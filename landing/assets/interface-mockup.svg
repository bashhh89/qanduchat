<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" rx="8" fill="#1e40af"/>
  
  <!-- Chat Interface -->
  <rect x="20" y="20" width="560" height="360" rx="8" fill="#f8fafc"/>
  
  <!-- Sidebar -->
  <rect x="20" y="20" width="180" height="360" rx="8" fill="#0f172a"/>
  
  <!-- Chat Header -->
  <rect x="210" y="20" width="370" height="60" rx="8" fill="#e2e8f0"/>
  
  <!-- Model Selection Dropdown -->
  <rect x="230" y="35" width="180" height="30" rx="4" fill="#ffffff"/>
  <text x="250" y="55" font-family="Arial" font-size="12" fill="#1e293b">GPT-4o (Pollinations)</text>
  
  <!-- Chat Messages -->
  <rect x="210" y="90" width="370" height="240" rx="8" fill="#ffffff"/>
  
  <!-- User Message -->
  <rect x="230" y="110" width="320" height="40" rx="8" fill="#e2e8f0"/>
  <text x="250" y="130" font-family="Arial" font-size="12" fill="#1e293b">How can I use QanDu for my project?</text>
  
  <!-- AI Response -->
  <rect x="230" y="160" width="320" height="80" rx="8" fill="#6366f1" opacity="0.1"/>
  <text x="250" y="180" font-family="Arial" font-size="12" fill="#1e293b">QanDu provides several AI models that can help with</text>
  <text x="250" y="200" font-family="Arial" font-size="12" fill="#1e293b">your project. You can use it for code generation,</text>
  <text x="250" y="220" font-family="Arial" font-size="12" fill="#1e293b">content creation, and much more!</text>
  
  <!-- Input Box -->
  <rect x="210" y="340" width="370" height="40" rx="8" fill="#e2e8f0"/>
  <text x="230" y="365" font-family="Arial" font-size="12" fill="#94a3b8">Type your message here...</text>
  
  <!-- Sidebar Elements -->
  <rect x="35" y="40" width="150" height="30" rx="4" fill="#1e293b"/>
  <text x="55" y="60" font-family="Arial" font-size="12" fill="#ffffff">New Chat</text>
  
  <rect x="35" y="80" width="150" height="30" rx="4" fill="#1e293b" opacity="0.6"/>
  <text x="55" y="100" font-family="Arial" font-size="12" fill="#ffffff">Project Brainstorm</text>
  
  <rect x="35" y="120" width="150" height="30" rx="4" fill="#1e293b" opacity="0.6"/>
  <text x="55" y="140" font-family="Arial" font-size="12" fill="#ffffff">Code Review</text>
  
  <rect x="35" y="160" width="150" height="30" rx="4" fill="#1e293b" opacity="0.6"/>
  <text x="55" y="180" font-family="Arial" font-size="12" fill="#ffffff">Content Writing</text>
  
  <!-- QanDu Logo -->
  <circle cx="55" y="330" r="15" fill="#6366f1"/>
  <text x="45" y="335" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Q</text>
  <text x="75" y="335" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">QanDu</text>
</svg> 